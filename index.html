  const finesSheet = workbook.Sheets['Fines'];
  if (finesSheet) {
    const finesRows = Object.values(finesSheet).filter(isDataRow);
    finesRows.forEach((row) => {
      if (!row.A) return;
      const name = playerNames.find((n) => row.A.toUpperCase().includes(n.toUpperCase()));  
      if (!name) return;
        
      let amount = Number(row.B);
      if (isNaN(amount)) amount = 0;
      
      let paid = Number(row.C); // Parse "Paid" column
      if (isNaN(paid)) paid = 0;
      
      parsed.fines.push({ name, amount, paid }); 
    });
  }

}

// 4. Update UI to show Paid and add Pay buttons
function renderFinesTable() {
  finesRows.innerHTML = '';
  
  // Add up total fines  
  const totalFines = finesData.reduce((sum, fine) => sum + fine.amount, 0);
  totalFinesEl.textContent = '₹' + totalFines.toLocaleString('en-IN');
  
  finesData.forEach((fine, i) => {
    const row = document.createElement('div');
    row.className = 'finesRow';
    
    const playerCol = document.createElement('div');
    playerCol.className = 'finesPlayerCol';
    playerCol.textContent = fine.name;
    row.appendChild(playerCol);
    
    const amountCol = document.createElement('div');
    amountCol.className = 'finesAmountCol';
    amountCol.textContent = '₹' + fine.amount.toLocaleString('en-IN');
    row.appendChild(amountCol);
    
    const paidCol = document.createElement('div'); 
    paidCol.className = 'finesAmountCol';
    paidCol.textContent = '₹' + fine.paid.toLocaleString('en-IN');
    
    if (fine.amount > fine.paid) {
      const payBtn = document.createElement('button');
      payBtn.textContent = 'Pay ₹' + (fine.amount - fine.paid).toLocaleString('en-IN');
      payBtn.addEventListener('click', () => {
        finesData[i].paid = fine.amount; 
        finesRef.set(finesData); // Save updated paid amount
      }); 
      paidCol.appendChild(payBtn);
    }
    
    row.appendChild(paidCol);
    
    finesRows.appendChild(row);
  });
}
